name: Actualizar precios

on:
  schedule:
    # cada 3 horas de 6:00 a 21:00 hora de Perú (UTC-5)
    - cron: "0 11,14,17,20,23 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Generar data/stations.json
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python pipeline/build_data.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data pipeline/cache
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios actualizados $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
