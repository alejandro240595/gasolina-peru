name: Compilar APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Versión = mayor.menor de package.json + número de ejecución (p. ej. 1.2.7).
      # nativeLevel va como versionCode del APK; si sube, la app pide reinstalar el APK.
      - name: Versión y configuración
        run: |
          VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}
          NATIVE=$(node -p "require('./package.json').gasolina.nativeLevel")
          REL=https://github.com/${{ github.repository }}/releases
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "NATIVE=$NATIVE" >> $GITHUB_ENV
          cat > www/config.js <<EOF
          window.GAS_CONFIG = {
            version: '$VERSION',
            dataUrl: 'https://raw.githubusercontent.com/${{ github.repository }}/main/data/stations.json',
            updateUrl: '$REL/latest/download/version.json'
          };
          EOF
          (cd www && zip -qr ../../www.zip .)
          # el plugin de actualización exige el SHA-256 del zip
          CHECKSUM=$(sha256sum ../www.zip | cut -d' ' -f1)
          cat > ../version.json <<EOF
          {"version": "$VERSION", "nativeLevel": $NATIVE, "checksum": "$CHECKSUM",
           "zip": "$REL/download/v$VERSION/www.zip",
           "apk": "$REL/download/v$VERSION/gasolina-peru.apk"}
          EOF
          cat www/config.js ../version.json

      - run: npm install --no-audit --no-fund

      # Modelo de voz español sin conexión para "Hola Oso" (~40 MB, se guarda en caché)
      - name: Caché del modelo de voz
        uses: actions/cache@v4
        with:
          path: app/vosk-model
          key: vosk-model-small-es-0.42

      - name: Descargar modelo de voz
        run: |
          if [ ! -d vosk-model/model-es ]; then
            curl -sSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
            mkdir -p vosk-model
            unzip -q /tmp/model.zip -d vosk-model
            mv vosk-model/vosk-model-small-es-0.42 vosk-model/model-es
          fi
          du -sh vosk-model/model-es

      - name: Crear proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.js
          sed -i -E "s/versionCode [0-9]+/versionCode $NATIVE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android

      # Con la misma llave de firma, cada APK nuevo se instala encima del anterior.
      - name: Llave de firma fija
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando llave de firma del secreto DEBUG_KEYSTORE_B64"
          fi

      - name: Compilar
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../gasolina-peru.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gasolina-peru-apk
          path: gasolina-peru.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Gasolina Perú v${{ env.VERSION }}
          body: |
            Primera instalación: descarga **gasolina-peru.apk** desde el celular e instálalo.
            Si ya tienes la app, se actualiza sola (te aparecerá "Nueva versión lista → Reiniciar").
          files: |
            gasolina-peru.apk
            www.zip
            version.json
          make_latest: true
